# Single-binary distribution (ADR-0002): Linux x86_64 + aarch64 as fully
# static musl binaries (no glibc floor — runs on any distro), macOS Apple
# Silicon. Tag a version matching Cargo.toml to build and attach binaries.
#
# The macOS binary is signed with a Developer ID certificate and notarized
# when the Apple secrets are configured (docs/release-signing.md). Without
# them it is built unsigned and the run says so in a warning.
#
# "Run workflow" (workflow_dispatch) is a dry run: it builds, signs and
# notarizes, and uploads the archives as run artifacts, but publishes nothing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin graffy
        env:
          CC: ${{ contains(matrix.target, 'musl') && 'musl-gcc' || 'cc' }}
      - name: Smoke test the built binary
        shell: bash
        run: |
          binary="./target/${{ matrix.target }}/release/graffy"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$("$binary" --version)" = "graffy ${GITHUB_REF_NAME#v}"
          else
            "$binary" --version  # dry run: no tag to compare against
          fi
          export GRAFFY_HOME="$(mktemp -d)"
          "$binary" init
          "$binary" run graffy.builtin.conversation --prompt "release smoke test" --offline
          "$binary" metrics --json
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          binary="./target/${{ matrix.target }}/release/graffy"
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::warning title=macOS binary is UNSIGNED::Apple signing secrets are not set, so this macOS binary is not signed or notarized. See docs/release-signing.md."
            exit 0
          fi
          # Signing was asked for: from here every missing piece is an error.
          : "${CERT_PASSWORD:?APPLE_DEVELOPER_ID_P12_PASSWORD is not set}"
          : "${SIGN_IDENTITY:?APPLE_SIGNING_IDENTITY is not set}"
          : "${NOTARY_KEY_BASE64:?APPLE_NOTARY_KEY_P8_BASE64 is not set}"
          : "${NOTARY_KEY_ID:?APPLE_NOTARY_KEY_ID is not set}"
          : "${NOTARY_ISSUER_ID:?APPLE_NOTARY_ISSUER_ID is not set}"

          keychain="$RUNNER_TEMP/graffy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/graffy-notarize.zip"
          }
          trap cleanup EXIT

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          # Hardened runtime + secure timestamp: both required for notarization.
          codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # A bare executable is notarized inside a zip. A ticket cannot be
          # stapled to a bare executable, so Gatekeeper checks it online.
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/graffy-notarize.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/graffy-notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json)"
          echo "$result"
          status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization ended with status '$status', not 'Accepted'."
            exit 1
          fi
          # The signed binary must still run.
          "$binary" --version
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/graffy" dist/
          cp LICENSE NOTICE.md README.md dist/
          python3 - <<'PY'
          import os, pathlib, tarfile
          ref = os.environ['GITHUB_REF_NAME'].replace('/', '-')  # a dry run's ref is a branch
          archive = f"graffy-{ref}-${{ matrix.target }}.tar.gz"
          def normalize(info):
              info.uid = info.gid = 0
              info.uname = info.gname = ""
              return info
          with tarfile.open(archive, "w:gz") as output:
              for path in sorted(pathlib.Path("dist").iterdir()):
                  output.add(path, arcname=path.name, filter=normalize)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: graffy-${{ matrix.target }}
          path: graffy-*.tar.gz

  publish:
    name: publish release
    # Only a tag publishes; a manual run is a dry run.
    if: github.ref_type == 'tag'
    needs: [checks, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
